[meta]
binary_name = "bootty"
version_source = "Cargo.toml"

[[platforms]]
id = "darwin-arm64"
target = "aarch64-apple-darwin"
os = "darwin"
cpu = "arm64"
artifact_binary = "bootty"
npm_package = "bootty-darwin-arm64"
npm_dir = "bootty-darwin-arm64"
python_package = "bootty-bin-darwin-arm64"
python_module = "bootty_bin_darwin_arm64"
python_marker = "platform_system == 'Darwin' and platform_machine == 'arm64'"

[[platforms]]
id = "darwin-x64"
target = "x86_64-apple-darwin"
os = "darwin"
cpu = "x64"
artifact_binary = "bootty"
npm_package = "bootty-darwin-x64"
npm_dir = "bootty-darwin-x64"
python_package = "bootty-bin-darwin-x64"
python_module = "bootty_bin_darwin_x64"
python_marker = "platform_system == 'Darwin' and platform_machine == 'x86_64'"

[[platforms]]
id = "linux-x64-gnu"
target = "x86_64-unknown-linux-gnu"
os = "linux"
cpu = "x64"
artifact_binary = "bootty"
npm_package = "bootty-linux-x64-gnu"
npm_dir = "bootty-linux-x64-gnu"
python_package = "bootty-bin-linux-x64-gnu"
python_module = "bootty_bin_linux_x64_gnu"
python_marker = "platform_system == 'Linux' and platform_machine == 'x86_64'"

[[platforms]]
id = "win32-x64-msvc"
target = "x86_64-pc-windows-msvc"
os = "win32"
cpu = "x64"
artifact_binary = "bootty.exe"
npm_package = "bootty-win32-x64-msvc"
npm_dir = "bootty-win32-x64-msvc"
python_package = "bootty-bin-win32-x64-msvc"
python_module = "bootty_bin_win32_x64_msvc"
python_marker = "platform_system == 'Windows' and platform_machine == 'AMD64'"
