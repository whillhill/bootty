name: release-publish-pypi

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of the release-build workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync versions
        run: uv run python scripts/sync_version.py

      - name: Validate Python dependency versions
        run: |
          uv run python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          root = Path(".")
          cargo_text = (root / "Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', cargo_text, flags=re.MULTILINE)
          if not match:
              raise SystemExit("Cargo.toml 版本号缺失")
          expected = match.group(1)

          pyproject = tomllib.loads((root / "python/packages/bootty/pyproject.toml").read_text(encoding="utf-8"))
          deps = pyproject["project"]["dependencies"]
          for dep in deps:
              if "bootty-bin-" not in dep:
                  continue
              if f"=={expected};" not in dep:
                  raise SystemExit(f"依赖版本不一致: {dep}，预期 {expected}")
          print(f"[完成] PyPI 主包依赖版本一致: {expected}")
          PY

      - name: Download release-build artifacts
        run: |
          mkdir -p dist
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu win32-x64-msvc; do
            gh run download "${{ inputs.build_run_id }}" --name "bootty-${platform}" --dir "dist/${platform}"
          done

      - name: Assemble PyPI platform packages
        run: uv run python scripts/assemble_pypi_packages.py --dist-root dist

      - name: Build all PyPI packages
        run: |
          mkdir -p wheelhouse
          for pkg in python/packages/*; do
            uv run --with build python -m build "$pkg" --sdist --wheel --outdir wheelhouse
          done

      - name: Validate package metadata
        run: uv run --with twine python -m twine check wheelhouse/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
