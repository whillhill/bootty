name: release-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build-${{ matrix.platform_id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_binary: bootty
          - platform_id: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_binary: bootty
          - platform_id: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_binary: bootty
          - platform_id: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_binary: bootty.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target artifact
        shell: bash
        run: ./scripts/build_target.sh "${{ matrix.target }}" "${{ matrix.platform_id }}" "${{ matrix.artifact_binary }}"

      - name: Run smoke test
        shell: bash
        run: ./scripts/smoke_test.sh "dist/${{ matrix.platform_id }}/${{ matrix.artifact_binary }}"

      - name: Generate checksums
        shell: bash
        run: |
          cd "dist/${{ matrix.platform_id }}"
          sha256sum "${{ matrix.artifact_binary }}" > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootty-${{ matrix.platform_id }}
          path: dist/${{ matrix.platform_id }}/*
          if-no-files-found: error
