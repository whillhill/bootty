name: release-publish-npm

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of the release-build workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release source
        shell: bash
        run: |
          echo "[info] Git ref: ${GITHUB_REF}"
          echo "[info] Git sha: ${GITHUB_SHA}"
          test -f npm/packages/bootty/package.json || { echo "[error] Missing npm/packages/bootty/package.json; this ref is not using the new release layout"; exit 1; }
          grep -q 'npm_packages_dir = ROOT / "npm" / "packages"' scripts/sync_version.py || { echo "[error] scripts/sync_version.py is outdated (likely still references old paths)"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Validate npm package metadata
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          expected = "https://github.com/whillhill/bootty"
          root = Path("npm/packages")
          for pkg in sorted(root.glob("*/package.json")):
              data = json.loads(pkg.read_text(encoding="utf-8"))
              repository = data.get("repository") or {}
              url = repository.get("url")
              if url != expected:
                  raise SystemExit(f"Invalid repository.url in {pkg}: {url!r}, expected {expected!r}")
          print("[ok] All npm package repository URLs are aligned")
          PY

      - name: Sync versions
        run: uv run python scripts/sync_version.py

      - name: Download release-build artifacts
        run: |
          mkdir -p dist
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu win32-x64-msvc; do
            gh run download "${{ inputs.build_run_id }}" --name "bootty-${platform}" --dir "dist/${platform}"
          done

      - name: Assemble npm platform packages
        run: uv run python scripts/assemble_npm_packages.py --dist-root dist

      - name: Publish npm platform packages
        run: |
          for pkg in \
            npm/packages/bootty-darwin-arm64 \
            npm/packages/bootty-darwin-x64 \
            npm/packages/bootty-linux-x64-gnu \
            npm/packages/bootty-win32-x64-msvc; do
            (cd "$pkg" && npm publish --access public --provenance)
          done

      - name: Publish npm main package
        run: |
          (cd npm/packages/bootty && npm publish --access public --provenance)
