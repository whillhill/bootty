[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootty-bin-linux-x64-gnu"
version = "0.1.5"
description = "bootty platform package (linux x64 gnu)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bootty_bin_linux_x64_gnu = ["bin/*"]
